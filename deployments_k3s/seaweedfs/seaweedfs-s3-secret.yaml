---
# Bootstrap S3 identity secret.
# Access/secret keys default to CHANGEME — override these via an ArgoCD
# secret override or a Sealed Secret before going to production.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: seaweedfs-s3-secret
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: s3
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "CHANGEME_ACCESS_KEY",
              "secretKey": "CHANGEME_SECRET_KEY"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
